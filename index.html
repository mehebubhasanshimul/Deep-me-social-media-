<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>YourSocialName.</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════
   UI/UX STYLES (Existing + New Sections)
═══════════════════════════════════════ */
:root{
  --bg:#080810;--surface:#10101a;--surface2:#18182a;
  --border:#1e1e30;--accent:#6c63ff;--accent2:#9b94ff;
  --text:#f0f0f8;--muted:#555568;--muted2:#8888aa;
  --red:#ff4d6d;--green:#22d3a0;--verified:#6c63ff;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* PAGE & LAYOUT SYSTEM */
.page{display:none;min-height:100vh;}
.page.active{display:block;}
#page-app.active{display:flex;flex-direction:column;min-height:100vh;}
.app-body{display:flex;flex:1;max-width:1400px;width:100%;margin:0 auto;}

/* --- EXISTING SIDEBAR, FEED, POST STYLES FROM YOUR CODE --- */
/* (সংক্ষিপ্ত করার জন্য আগের সব স্টাইল এখানে কাজ করবে ধরে নেওয়া হয়েছে) */

/* NEW: MESSENGER & NOTIFICATION STYLES */
.chat-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
.chat-item:hover { background: var(--surface2); }
.msg-bubble { padding: 8px 14px; border-radius: 16px; max-width: 80%; font-size: 14px; margin-bottom: 4px; }
.msg-me { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
.msg-them { align-self: flex-start; background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; }

/* MODALS */
.mo{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px;}
.mo.open{display:flex;}
.mo-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
.mo-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
</style>
</head>
<body>

<div id="toast"></div>
<input type="file" id="post-file" accept="image/*,video/*" style="display:none" onchange="handlePostFile(this)"/>

<div id="page-login" class="page active">
  <div class="auth-bg">
    <div class="auth-card">
        <h2 class="auth-logo-text">YourBrand<span>.</span></h2>
        <input class="fi" id="l-email" type="email" placeholder="Email"/>
        <input class="fi" id="l-pass" type="password" placeholder="Password"/>
        <button class="auth-btn" onclick="doLogin()">Login</button>
        <p class="auth-link">Account নেই? <a onclick="showPage('signup')">Sign Up</a></p>
    </div>
  </div>
</div>

<div id="page-app" class="page">
  <div class="app-body">
    <aside class="sidebar" style="width:240px; border-right: 1px solid var(--border); padding: 20px;">
      <h2 class="sb-logo">YourBrand<span>.</span></h2>
      <button class="nav-item active" onclick="showSection('feed')">Home</button>
      <button class="nav-item" onclick="showSection('messenger')">Messages</button>
      <button class="nav-item" onclick="showSection('notifications')">Notifications</button>
      <button class="nav-item" onclick="showSection('profile')">Profile</button>
      <button class="create-btn" onclick="openPostMo()" style="margin-top:20px;">+ Create Post</button>
    </aside>

    <section class="feed" id="sec-feed">
      <div id="post-feed">Loading posts...</div>
    </section>

    <section class="feed" id="sec-messenger" style="display:none;">
      <h3 class="sec-title">Messages</h3>
      <div id="chat-list-container">
          </div>
    </section>

    <section class="feed" id="sec-notifications" style="display:none;">
      <h3 class="sec-title">Notifications</h3>
      <div id="notif-list-container">
          </div>
    </section>

    <section class="feed" id="sec-profile" style="display:none;">
        <div id="profile-content"></div>
        <button class="auth-btn" onclick="doLogout()" style="background:var(--red); margin-top:20px;">Logout</button>
    </section>
  </div>
</div>

<div class="mo" id="chat-mo">
  <div class="mo-box" style="height: 80vh; display: flex; flex-direction: column;">
    <div class="mo-title" id="chat-title">Chat <button onclick="closeMo('chat-mo')">×</button></div>
    <div id="chat-messages" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:10px;"></div>
    <div style="display:flex; gap:10px; margin-top:10px;">
        <input id="msg-input" class="fi" placeholder="Write a message..."/>
        <button class="auth-btn" id="send-msg-btn" style="width:80px;">Send</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FB_CFG = { /* আপনার ফায়ারবেস কনফিগ এখানে দিন */ };
const app = initializeApp(FB_CFG);
const auth = getAuth(app);
const db = getFirestore(app);
let ME = null;

const $ = id => document.getElementById(id);

// --- AUTH HANDLER ---
onAuthStateChanged(auth, async user => {
  if (user) {
    ME = { uid: user.uid, displayName: user.displayName || "User" };
    showPage('app');
    loadPosts();
  } else {
    showPage('login');
  }
});

// --- SECTION SWITCHER ---
window.showSection = function(sec) {
  const sections = ['sec-feed', 'sec-messenger', 'sec-notifications', 'sec-profile'];
  sections.forEach(s => $(s).style.display = s === 'sec-'+sec ? 'block' : 'none');
  
  if(sec === 'notifications') loadNotifications();
  if(sec === 'messenger') loadChatList();
};

// --- MESSENGER LOGIC ---
let activeChatId = null;

window.openChat = function(targetUid, targetName) {
  activeChatId = [ME.uid, targetUid].sort().join("_");
  $('chat-title').textContent = "Chat with " + targetName;
  $('chat-mo').classList.add('open');
  
  // Real-time messages
  const q = query(collection(db, "messages"), where("chatId", "==", activeChatId), orderBy("createdAt", "asc"));
  onSnapshot(q, snap => {
    const box = $('chat-messages');
    box.innerHTML = "";
    snap.forEach(d => {
      const m = d.data();
      const isMe = m.senderId === ME.uid;
      box.innerHTML += `<div class="msg-bubble ${isMe ? 'msg-me' : 'msg-them'}">${m.text}</div>`;
    });
    box.scrollTop = box.scrollHeight;
  });

  $('send-msg-btn').onclick = () => sendMessage(targetUid);
};

async function sendMessage(targetUid) {
  const text = $('msg-input').value.trim();
  if (!text) return;
  $('msg-input').value = "";
  
  await addDoc(collection(db, "messages"), {
    chatId: activeChatId,
    senderId: ME.uid,
    text: text,
    createdAt: serverTimestamp()
  });

  // Create Notification for the receiver
  await addDoc(collection(db, "notifications"), {
    toUid: targetUid,
    fromName: ME.displayName,
    text: "sent you a message.",
    type: "message",
    createdAt: serverTimestamp()
  });
}

// --- NOTIFICATIONS LOGIC ---
function loadNotifications() {
  const q = query(collection(db, "notifications"), where("toUid", "==", ME.uid), orderBy("createdAt", "desc"));
  onSnapshot(q, snap => {
    const container = $('notif-list-container');
    container.innerHTML = snap.empty ? "No new notifications" : "";
    snap.forEach(d => {
      const n = d.data();
      container.innerHTML += `<div class="chat-item"><b>${n.fromName}</b> ${n.text}</div>`;
    });
  });
}

// (বাকি ফাংশনগুলো যেমন doLogin, loadPosts আগের মতোই থাকবে)
window.showPage = name => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    $('page-'+name).classList.add('active');
};

window.closeMo = id => $(id).classList.remove('open');

</script>
</body>
</html>
